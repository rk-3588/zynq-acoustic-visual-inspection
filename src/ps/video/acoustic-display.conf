# Explicit quiet calibration replaces noise_peak=0. Never calibrate at boot.
noise_peak=0
on_ratio=2.0
off_ratio=1.4
on_count=3
off_count=8
period_ms=50
alpha=100
adaptive=1
contrast_min=0.03
# Fraction of the linear min..max energy range hidden; not a pixel fraction.
# 0.08 = previous broad map; 0.65 = concentrated; allowed range 0..0.95.
hotspot_floor_ratio=0.65
# Start of red in retained log-energy range, not a fraction of pixels.
# 0.82 = previous red core; allowed range 0.65..0.99.
red_core_ratio=0.95
attack_seconds=0.10
release_seconds=0.60
slew_bits_per_second=6.0
